name: Ansible

on:
  pull_request:
    paths:
      - ansible/**
      - .github/workflows/ansible.yml
  push:
    branches: [main]
    paths:
      - ansible/**
      - .github/workflows/ansible.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements-dev.txt

      - name: Install pinned validation tools
        run: python -m pip install --requirement ansible/requirements-dev.txt

      - name: Install pinned Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install --requirements-file requirements.yml

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint .

      - name: Check playbook syntax
        working-directory: ansible
        run: |
          ansible-playbook playbooks/provision.yml --syntax-check
          ansible-playbook playbooks/verify.yml --syntax-check
