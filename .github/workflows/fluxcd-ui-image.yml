name: fluxcd-ui image

# Upstream (registry.mkz.me/mycroft/fluxcd-ui) is amd64-only and k3s01 is
# ARM64: rebuild the pinned release for arm64. Keep VERSION in step with the
# chart in infrastructure/fluxcd-ui/helm-release.yaml.

on:
  pull_request:
    paths:
      - .github/workflows/fluxcd-ui-image.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/fluxcd-ui-image.yml
  workflow_dispatch:

env:
  VERSION: 0.5.0
  # v0.5.0
  COMMIT: 51a6ae1e9a3b92740266387180b9eb9f2bc874da
  IMAGE: ghcr.io/polinetworkorg/fluxcd-ui

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fluxcd-ui
        uses: actions/checkout@v5
        with:
          repository: mycroft/fluxcd-ui
          ref: ${{ env.COMMIT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile cross-compiles on the runner; the arm64 stage only
      # copies the binary, so no emulation is needed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
