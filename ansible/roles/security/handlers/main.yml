---
- name: Reload sysctl
  ansible.builtin.command: /usr/sbin/sysctl --system
  changed_when: true

- name: Reload SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Reload systemd for firewall
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload PoliNetwork firewall
  ansible.builtin.systemd_service:
    name: polinetwork-firewall
    state: reloaded
