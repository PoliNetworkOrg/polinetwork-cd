apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth
  ports:
    - name: auth
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: ghcr.io/polinetworkorg/auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: TZ
              value: "Europe/Rome"
            - name: DB_NAME
              value: "polinetwork_auth"
            - name: DB_HOST
              value: "postgres-service.postgres.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: db-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: db-pass
            - name: BETTER_AUTH_URL
              value: "https://auth.polinetwork.org"
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: auth-secret
            - name: OAUTH_BACKEND_RESOURCE_URI
              value: "https://backend.internal.polinetwork.org" # must not change, does not need to resolve
            - name: OAUTH_INTERNAL_RESOURCE_URI
              value: "https://auth.polinetwork.org/api/internal" # must not change
            - name: OAUTH_BACKEND_CLIENT_ID
              value: "cOLVzDyABDuChVIjNoKQlGhobVpklvEL"
            - name: OAUTH_BACKEND_EVENTS_URL
              value: "http://backend-service.backend.svc.cluster.local:3000/internal/events"
            - name: PN_ENTRA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: entra-client-id
            - name: PN_ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: entra-client-secret
            - name: PN_ENTRA_TENANT_ID
              value: "7f8cafc8-4314-4070-9744-fe02f91bcb21" # PoliNetwork APS
            - name: PN_ENTRA_MEMBER_GROUP_ID
              value: "1c68dbb8-4ac3-4569-a886-283b5a825cbd" # soci
            - name: PN_ENTRA_DIRETTIVO_GROUP_ID
              value: "5f9d5005-6e4d-49f7-8d09-70928477e9d1" # direttivo
            - name: PN_ENTRA_OIDC_ADMIN_GROUP_ID
              value: "0f83b541-3167-4e14-aeb6-30ba96c08668" # it-owners
            - name: PN_ENTRA_MEMBER_REFRESH_HOURS
              value: "24"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: google-client-secret
            - name: TELEGRAM_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: telegram-client-id
            - name: TELEGRAM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: telegram-client-secret
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "20m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
