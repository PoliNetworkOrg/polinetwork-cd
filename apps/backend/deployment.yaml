apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - name: backend
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/polinetworkorg/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: TZ
              value: "Europe/Rome"
            - name: DB_NAME
              value: "polinetwork_backend"
            - name: DB_HOST
              value: "postgres-service.postgres.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: db-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: db-pass
            - name: REDIS_HOST
              value: "redis-service.redis.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: encryption-key
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: azure-client-id
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: azure-client-secret
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: azure-tenant-id
            - name: ESIGN_DRIVES
              value: '[{"id":"direttivo","label":"Direttivo","driveId":"b!09ICEgnCtUGck5rmjWKeffoL7gZr2fBCoK6t5EEFazVGYKsrKc_mTZXCDtiHZ3U9"},{"id":"soci","label":"Soci","driveId":"b!RMzJseEYIEeB1qxAvIkAjQL94vWgCHNAvZ436eWgbLyhQQPc55YqS4svC-xBpWPu"}]'
            - name: IDP_PUBLIC_URL
              value: "https://auth.polinetwork.org"
            - name: IDP_INTERNAL_URL
              value: "http://auth-service.auth.svc.cluster.local:3000"
            - name: OAUTH_BACKEND_RESOURCE_URI
              value: "https://backend.internal.polinetwork.org" # must not change, does not need to resolve
            - name: OAUTH_INTERNAL_RESOURCE_URI
              value: "https://auth.polinetwork.org/api/internal" # must not change
            - name: OAUTH_BACKEND_CLIENT_ID
              value: "cOLVzDyABDuChVIjNoKQlGhobVpklvEL"
            - name: OAUTH_BOT_CLIENT_ID # to validate bot requests
              value: "BpVpKudIaGgTalELuHTSgtOrTCGCvjsX"
            - name: OAUTH_BACKEND_PRIVATE_JWK
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: oauth-private-jwk
            # Regulations editor: every variable is optional and the feature
            # stays off without them. Empty values (TODO) are pending from
            # Lorenzo; the backend reads env with emptyStringAsUndefined.
            - name: REGULATIONS_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: regulations
                  key: internal-secret
                  optional: true
            - name: REGULATIONS_COLLAB_PUBLIC_URL # handed to browsers in collab tickets
              value: "wss://collab.polinetwork.org"
            - name: REGULATIONS_COLLAB_INTERNAL_URL
              value: "http://regulations-collab.backend.svc.cluster.local:4101"
            - name: REGULATIONS_WORKER_URL
              value: "http://latex-worker.latex-worker.svc.cluster.local:4200"
            - name: REGULATIONS_WORKER_SECRET
              valueFrom:
                secretKeyRef:
                  name: regulations
                  key: worker-secret
                  optional: true
            - name: REGULATIONS_GITHUB_MODE
              value: "app"
            # GitHub App webhook: POST https://api.polinetwork.org/public/webhooks/github
            # (public-route.yaml), verified with this secret. Polling is only a slow
            # reconciliation for missed deliveries.
            - name: REGULATIONS_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: regulations
                  key: github-webhook-secret
                  optional: true
            - name: REGULATIONS_GITHUB_APP_ID
              value: "" # TODO: GitHub App ID
            - name: REGULATIONS_GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: regulations
                  key: github-app-private-key
                  optional: true
            - name: REGULATIONS_GITHUB_REPO
              value: "PoliNetworkOrg/legal"
            - name: REGULATIONS_GITHUB_BASE
              value: "main"
            - name: REGULATIONS_LLM_PROVIDER
              value: "" # TODO: "anthropic" (the only provider implemented) once the key exists
            - name: REGULATIONS_LLM_MODEL
              value: "" # TODO
            - name: REGULATIONS_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: regulations
                  key: llm-api-key
                  optional: true
            - name: REGULATIONS_TELEGRAM_CHAT_ID
              value: "" # TODO: Soci group chat id
            - name: REGULATIONS_TELEGRAM_TOPIC_ID
              value: "" # TODO: Soci group topic id
            - name: REGULATIONS_EMAIL_SENDER
              value: "noreply@polinetwork.org" # TODO: confirm the final sender
            - name: REGULATIONS_EMAIL_TO
              value: "soci@polinetwork.org"
            - name: REGULATIONS_EMAIL_REPLY_TO
              value: "direttivo@polinetwork.org"
            - name: REGULATIONS_DIRETTIVO_EMAIL
              value: "direttivo@polinetwork.org"
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "20m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
