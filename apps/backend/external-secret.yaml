apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azure-kv
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: azure-kv
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: azure-client-id
      remoteRef:
        key: backend-azure-client-id
    - secretKey: azure-client-secret
      remoteRef:
        key: backend-azure-client-secret
    - secretKey: azure-tenant-id
      remoteRef:
        key: backend-azure-tenant-id
    - secretKey: encryption-key
      remoteRef:
        key: backend-encryption-key
    - secretKey: db-pass
      remoteRef:
        key: postgres-root-password
    - secretKey: db-user
      remoteRef:
        key: postgres-root-user
    - secretKey: oauth-private-jwk
      remoteRef:
        key: backend-private-jwk
---
# Regulations editor secrets, kept apart from azure-kv so a missing entry never
# blocks the backend's own credentials. The Deployments mark them optional.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regulations
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: regulations
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Backend <-> regulations-collab calls.
    - secretKey: internal-secret
      remoteRef:
        key: regulations-internal-secret
    # Backend and collab -> latex-worker calls; latex-worker reads the same entry.
    - secretKey: worker-secret
      remoteRef:
        key: regulations-worker-secret
    - secretKey: github-app-private-key
      remoteRef:
        key: regulations-github-app-private-key
    - secretKey: github-webhook-secret
      remoteRef:
        key: regulations-github-webhook-secret
    - secretKey: llm-api-key
      remoteRef:
        key: regulations-llm-api-key
