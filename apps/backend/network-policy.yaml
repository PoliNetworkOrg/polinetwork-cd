# Only the in-cluster callers may reach the backend (RFC v3 §12): the admin
# dashboard and the website (tRPC, esign agent proxy), the Telegram bot (tRPC
# and its socket), the IdP (access-changed events on /internal/events) and
# Uptime Kuma (health monitoring).
# Nothing reaches it from outside the cluster since the Ingress was removed;
# the regulations-collab Ingress publishes only collab's websocket port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-callers
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: admin
          podSelector:
            matchLabels:
              app: admin
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: web
          podSelector:
            matchLabels:
              app: web
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bot-ts
          podSelector:
            matchLabels:
              app: bot-ts
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth
          podSelector:
            matchLabels:
              app: auth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
          podSelector:
            matchLabels:
              app: uptime-kuma
      ports:
        - port: 3000
          protocol: TCP
---
# regulations-collab faces the internet: Traefik reaches the websocket port
# only, the backend the internal API, and collab itself may reach only DNS,
# PostgreSQL and the LaTeX worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: regulations-collab
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app: regulations-collab
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 4100
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 4101
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: latex-worker
          podSelector:
            matchLabels:
              app: latex-worker
      ports:
        - port: 4200
          protocol: TCP
