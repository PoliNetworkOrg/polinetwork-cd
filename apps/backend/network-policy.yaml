# Only the in-cluster callers may reach the backend (RFC v3 §12): the admin
# dashboard and the website (tRPC, esign agent proxy), the Telegram bot (tRPC
# and its socket), the IdP (access-changed events on /internal/events) and
# Kuvasz (uptime monitoring).
# From outside the cluster, Traefik reaches it only through the backend-public
# IngressRoute (public-route.yaml), which matches the declared /public prefix
# and nothing else; a NetworkPolicy cannot filter paths, so that route is the
# guard.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-callers
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: admin
          podSelector:
            matchLabels:
              app: admin
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: web
          podSelector:
            matchLabels:
              app: web
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bot-ts
          podSelector:
            matchLabels:
              app: bot-ts
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth
          podSelector:
            matchLabels:
              app: auth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kuvasz
          podSelector:
            matchLabels:
              app: kuvasz
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: live-audience
          podSelector:
            matchLabels:
              app: live-audience
      ports:
        - port: 3000
          protocol: TCP
