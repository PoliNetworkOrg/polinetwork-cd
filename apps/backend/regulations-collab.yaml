apiVersion: v1
kind: Service
metadata:
  name: regulations-collab
spec:
  selector:
    app: regulations-collab
  ports:
    - name: websocket
      port: 4100
      targetPort: 4100
    - name: internal
      port: 4101
      targetPort: 4101
---
# Hocuspocus server for the regulations editor: the backend image with another
# entrypoint, so it always runs the backend's digest (same Flux Kustomization).
# Port 4100 is the editors' websocket, published on collab.polinetwork.org; it
# accepts only single-use tickets from regulations.collabTicket. Port 4101 is
# the internal API, for the backend only. Exactly one replica, replaced with
# Recreate: Hocuspocus keeps open documents in memory, so two pods would split
# the editors of a draft between two copies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regulations-collab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: regulations-collab
  template:
    metadata:
      labels:
        app: regulations-collab
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # The image's "bun" user.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: regulations-collab
          image: ghcr.io/polinetworkorg/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", "collab.js"]
          ports:
            - containerPort: 4100
            - containerPort: 4101
          env:
            - name: NODE_ENV
              value: "production"
            - name: TZ
              value: "Europe/Rome"
            - name: TMPDIR
              value: "/tmp"
            - name: COLLAB_PORT
              value: "4100"
            - name: COLLAB_INTERNAL_PORT
              value: "4101"
            # Match the worker's WORKER_CONCURRENCY: more would only queue there.
            - name: REGULATIONS_COMPILE_CONCURRENCY
              value: "2"
            - name: COLLAB_SNAPSHOT_MINUTES
              value: "10"
            - name: DB_NAME
              value: "polinetwork_backend"
            - name: DB_HOST
              value: "postgres-service.postgres.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: db-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: db-pass
            # Required: collab refuses to start without it.
            - name: REGULATIONS_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: regulations
                  key: internal-secret
            - name: REGULATIONS_WORKER_URL
              value: "http://latex-worker.latex-worker.svc.cluster.local:4200"
            - name: REGULATIONS_WORKER_SECRET
              valueFrom:
                secretKeyRef:
                  name: regulations
                  key: worker-secret
                  optional: true
          startupProbe:
            tcpSocket:
              port: 4100
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 4100
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 4100
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "20m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
