# Shown only on uptime.polinetwork.org, behind the it-member gate.
# Prometheus alerts on "Internal tools" as warning, on the rest as critical
# (apps/monitoring/prometheus).
# Redirects are never followed: this instance may reach the backend, PostgreSQL
# and Redis, so a monitored origin must not be able to point it there.
endpoints:
  - name: Website (beta)
    group: Public services
    url: https://beta.polinetwork.org
    client:
      ignore-redirect: true
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Vaultwarden
    group: Internal tools
    url: https://vault.polinetwork.org/alive
    client:
      ignore-redirect: true
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Grafana
    group: Internal tools
    url: https://monitoring.polinetwork.org/api/health
    client:
      ignore-redirect: true
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].database == ok"

  - name: InfluxDB
    group: Internal tools
    url: https://influx.polinetwork.org/health
    client:
      ignore-redirect: true
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == pass"

  - name: Flux
    group: Internal tools
    url: https://flux.polinetwork.org
    client:
      ignore-redirect: true
    interval: 300s
    conditions:
      - "[STATUS] == 200"

  # The regulations editor's websocket server answers plain GETs with a banner.
  - name: Regulations collab
    group: Internal tools
    url: https://collab.polinetwork.org
    client:
      ignore-redirect: true
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  # In-cluster only: the backend has no public route except /public
  # (apps/backend/network-policy.yaml admits Gatus).
  - name: Backend
    group: Cluster
    url: http://backend-service.backend.svc.cluster.local:3000/
    client:
      ignore-redirect: true
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*hi*)"

  - name: PostgreSQL
    group: Cluster
    url: tcp://postgres-service.postgres.svc.cluster.local:5432
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: Redis
    group: Cluster
    url: tcp://redis-service.redis.svc.cluster.local:6379
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
