# Public services: shown on status.polinetwork.org and on uptime.polinetwork.org
# (both instances load this file). Checked through Cloudflare like a visitor,
# following redirects.
# Prometheus alerts on these as critical (apps/monitoring/prometheus).
# Reference: https://github.com/TwiN/gatus#endpoints
endpoints:
  - name: Website
    group: Public services
    url: https://polinetwork.org
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Auth
    group: Public services
    url: https://auth.polinetwork.org/api/auth/.well-known/openid-configuration
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].issuer == https://auth.polinetwork.org/api/auth"

  # Redirects to the sign-in page on auth.polinetwork.org.
  - name: Admin dashboard
    group: Public services
    url: https://admin.polinetwork.org
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Live Audience
    group: Public services
    url: https://live.polinetwork.org/healthz
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  # Its root redirects to polinetwork.org.
  - name: polinet.cc
    group: Public services
    url: https://polinet.cc
    interval: 60s
    conditions:
      - "[STATUS] == 200"
