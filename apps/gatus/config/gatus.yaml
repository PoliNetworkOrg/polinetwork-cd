# uptime.polinetwork.org: every endpoint, for IT. Gatus has no sign-in of its
# own here (its OIDC lacks PKCE, which auth.polinetwork.org requires); the
# it-member gate in front of the whole host does it (ingress.yaml).
#
# Alerts come from Prometheus, which scrapes /metrics and sends them through
# Alertmanager to the IT Telegram group, so Gatus has no alerting block.
metrics: true
concurrency: 5

storage:
  type: sqlite
  path: /data/gatus.db
  caching: true

ui:
  title: PoliNetwork uptime
  description: Uptime of every PoliNetwork service, for the IT team.
  header: PoliNetwork uptime
  link: https://polinetwork.org
  default-sort-by: group
  buttons:
    - name: Public status page
      link: https://status.polinetwork.org
    - name: Grafana
      link: https://monitoring.polinetwork.org
