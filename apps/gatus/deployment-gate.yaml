# oauth2-proxy as a Traefik forwardAuth endpoint in front of all of
# uptime.polinetwork.org. It admits only people whose `groups` claim (their
# roles, inheritance expanded) contains it-member.
# Redirect URI: https://uptime.polinetwork.org/oauth2/callback
apiVersion: v1
kind: Service
metadata:
  name: gatus-gate
  labels:
    app: gatus-gate
spec:
  ports:
    - name: http
      port: 4180
      targetPort: 4180
  selector:
    app: gatus-gate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus-gate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus-gate
  template:
    metadata:
      labels:
        app: gatus-gate
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          imagePullPolicy: IfNotPresent
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://auth.polinetwork.org/api/auth
            - --scope=openid profile email polinetwork:identity
            - --code-challenge-method=S256
            - --redirect-url=https://uptime.polinetwork.org/oauth2/callback
            - --whitelist-domain=uptime.polinetwork.org
            - --oidc-groups-claim=groups
            - --allowed-group=it-member
            # Access is decided by role, not by address, and Telegram-only
            # accounts may have no (verified) email: identify people by sub.
            - --oidc-email-claim=sub
            - --email-domain=*
            - --insecure-oidc-allow-unverified-email=true
            # forwardAuth mode: 202 for an admitted person, otherwise a
            # redirect to auth.polinetwork.org or a 403.
            - --upstream=static://202
            - --reverse-proxy=true
            - --trusted-proxy-ip=10.52.0.0/16
            - --skip-provider-button=true
            # The session is the whole dashboard session; without refresh
            # tokens, someone removed from IT keeps access for at most 8h.
            # __Host-: host-only, Secure, path /; no sibling subdomain can
            # set or shadow it.
            - --cookie-name=__Host-uptime_gate
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gatus-gate
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gatus-gate
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: gatus-gate
                  key: cookie-secret
          ports:
            - containerPort: 4180
          startupProbe:
            httpGet:
              path: /ping
              port: 4180
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
