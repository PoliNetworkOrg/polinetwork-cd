# Only the access gate has secrets. Gatus itself has none: it sends no alerts
# (Prometheus does, from its metrics) and has no sign-in of its own.
#
# OIDC client "Uptime (Gatus) access gate" on auth.polinetwork.org, redirect URI
# https://uptime.polinetwork.org/oauth2/callback, scopes openid profile email
# polinetwork:identity. gatus-gate-cookie-secret is 32 random bytes, base64url:
#   openssl rand -base64 32 | tr -- '+/' '-_'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-gate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: gatus-gate
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef:
        key: gatus-gate-oidc-client-id
    - secretKey: client-secret
      remoteRef:
        key: gatus-gate-oidc-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: gatus-gate-cookie-secret
