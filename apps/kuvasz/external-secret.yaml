# The role and database are created once by hand on postgres-service:
#   CREATE ROLE kuvasz LOGIN PASSWORD '...';
#   CREATE DATABASE kuvasz OWNER kuvasz;
# Kuvasz creates and migrates its own `kuvasz` schema on startup.
#
# Two OIDC clients on auth.polinetwork.org (see ingress.yaml):
# - kuvasz-oidc-*: Kuvasz's own sign-in.
# - kuvasz-gate-oidc-*: oauth2-proxy, which admits only it-member to Kuvasz's
#   sign-in routes. kuvasz-gate-cookie-secret is 32 random bytes, base64url:
#   openssl rand -base64 32 | tr -- '+/' '-_'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azure-kv
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: azure-kv
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: db-user
      remoteRef:
        key: kuvasz-postgres-user
    - secretKey: db-pass
      remoteRef:
        key: kuvasz-postgres-password
    - secretKey: oidc-client-id
      remoteRef:
        key: kuvasz-oidc-client-id
    - secretKey: oidc-client-secret
      remoteRef:
        key: kuvasz-oidc-client-secret
    - secretKey: gate-client-id
      remoteRef:
        key: kuvasz-gate-oidc-client-id
    - secretKey: gate-client-secret
      remoteRef:
        key: kuvasz-gate-oidc-client-secret
    - secretKey: gate-cookie-secret
      remoteRef:
        key: kuvasz-gate-cookie-secret
