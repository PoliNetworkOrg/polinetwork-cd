apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kuvasz

resources:
  - namespace.yaml
  - external-secret.yaml
  - deployment-kuvasz.yaml
  - deployment-gate.yaml
  - middleware.yaml
  - ingress.yaml
  - network-policy.yaml

# The generated name carries a content hash, so editing kuvasz.yml rolls out
# Kuvasz, which only reads it on startup.
configMapGenerator:
  - name: kuvasz-config
    files:
      - kuvasz.yml
