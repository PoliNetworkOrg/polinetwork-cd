apiVersion: v1
kind: Service
metadata:
  name: latex-worker
spec:
  selector:
    app: latex-worker
  ports:
    - name: http
      port: 4200
      targetPort: 4200
---
# Compiles regulation drafts with xelatex for the backend and collab. It runs untrusted
# LaTeX, so it has no network egress, no service account token, a read-only
# root and a size-limited tmpfs workdir. The worker runs each xelatex in a clean
# environment it builds itself: no shell escape, openin_any/openout_any paranoid,
# caches under WORKER_TMP_DIR, and an address-space prlimit. One pod with a small internal pool:
# warm per-draft workdirs (.aux) live in its memory, and the node has 2 vCPUs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: latex-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: latex-worker
  template:
    metadata:
      labels:
        app: latex-worker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # A uid no other workload uses (not the image's 1000): the worker caps
        # each xelatex with prlimit --nproc, and RLIMIT_NPROC counts every task
        # of the uid on the node, so sharing 1000 with Bun and Node apps made
        # xelatex unable to fork xdvipdfmx (tested: compiles fail at ~90 tasks).
        runAsUser: 10200
        runAsGroup: 10200
        fsGroup: 10200
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: latex-worker
          image: ghcr.io/polinetworkorg/latex-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4200
          env:
            - name: NODE_ENV
              value: "production"
            - name: TZ
              value: "Europe/Rome"
            - name: WORKER_PORT
              value: "4200"
            - name: WORKER_SECRET
              valueFrom:
                secretKeyRef:
                  name: regulations
                  key: worker-secret
            - name: WORKER_WORK_DIR
              value: "/work"
            - name: WORKER_TMP_DIR
              value: "/tmp"
            # Parallel xelatex runs; a third only contends for the same 1.5 CPUs.
            - name: WORKER_CONCURRENCY
              value: "2"
            - name: WORKER_TIMEOUT_MS
              value: "45000"
            # Per-xelatex prlimit; real usage is ~200Mi per run, see resources.
            - name: WORKER_MEMORY_LIMIT_MB
              value: "1024"
            # Warm workdirs kept on /work (~8Mi each with the RRI).
            - name: WORKER_MAX_WORKDIRS
              value: "40"
          startupProbe:
            httpGet:
              path: /health
              port: 4200
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4200
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4200
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Measured on the RRI (19 pages) in this sandbox: a cold latexmk takes
          # 1.8 s, a warm pass 0.4 s, 3 parallel passes peak at 650Mi including
          # tmpfs. Memory-backed volumes count against the memory limit, so the
          # limit covers a full 512Mi /work too. CPU stays below the node's
          # 2 vCPUs so a compile burst cannot starve the other workloads.
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
              ephemeral-storage: "256Mi"
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
