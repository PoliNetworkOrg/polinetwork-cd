# The shared secret the backend and regulations-collab present on every call.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regulations
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: regulations
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: worker-secret
      remoteRef:
        key: regulations-worker-secret
