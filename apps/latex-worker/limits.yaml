# Caps the namespace so a runaway compile cannot starve the single node: no
# container above the worker's own limits, and no more than one worker's worth
# of resources in total (the Deployment uses Recreate, never two pods at once).
apiVersion: v1
kind: LimitRange
metadata:
  name: latex-worker
spec:
  limits:
    - type: Container
      max:
        cpu: "1500m"
        memory: "1536Mi"
        ephemeral-storage: "256Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
        ephemeral-storage: "128Mi"
      defaultRequest:
        cpu: "50m"
        memory: "128Mi"
        ephemeral-storage: "64Mi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: latex-worker
spec:
  hard:
    pods: "2"
    requests.cpu: "500m"
    requests.memory: "768Mi"
    requests.ephemeral-storage: "128Mi"
    limits.cpu: "1500m"
    limits.memory: "1536Mi"
    limits.ephemeral-storage: "256Mi"
    services.loadbalancers: "0"
    services.nodeports: "0"
