# Confidential OIDC client registered on auth.polinetwork.org (web app,
# client_secret_basic, scopes "openid profile polinetwork:identity").
# Redirect URI: https://live.polinetwork.org/auth/callback
# Post-logout redirect URI: https://live.polinetwork.org/
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azure-kv
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: azure-kv
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: oidc-client-id
      remoteRef:
        key: live-audience-oidc-client-id
    - secretKey: oidc-client-secret
      remoteRef:
        key: live-audience-oidc-client-secret
