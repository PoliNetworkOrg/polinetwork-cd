# Alert rules sent to Telegram through Alertmanager.
#
# Every alert that has two levels is defined twice with the same name:
# once with severity "warning" and once with severity "critical".
# Alertmanager mutes the warning while the critical one is firing.
#
# To tune an alert change:
#   - the number after ">" (threshold)
#   - "for" (how long the condition must hold before notifying)
# Delivery (repeat interval, grouping) lives in ../alertmanager/alertmanager.yml.

groups:
  - name: node
    rules:
      - alert: NodeCPUHigh
        expr: 100 * (1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'CPU at {{ $value | printf "%.0f" }}% on {{ $labels.node }}'

      - alert: NodeCPUHigh
        expr: 100 * (1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'CPU at {{ $value | printf "%.0f" }}% on {{ $labels.node }}'

      - alert: NodeMemoryHigh
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'RAM at {{ $value | printf "%.0f" }}% on {{ $labels.node }}'

      - alert: NodeMemoryHigh
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'RAM at {{ $value | printf "%.0f" }}% on {{ $labels.node }}'

      - alert: NodeDiskHigh
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"}) > 70
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} at {{ $value | printf "%.0f" }}% on {{ $labels.node }}'

      - alert: NodeDiskHigh
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"}) > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} at {{ $value | printf "%.0f" }}% on {{ $labels.node }}'

      - alert: NodeDiskFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"}[6h], 24 * 3600) < 0
          and
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"}) > 60
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} on {{ $labels.node }} will be full within 24h at the current rate'

      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Node {{ $labels.node }} is NotReady'

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'node-exporter unreachable on {{ $labels.node }}'

  - name: kubernetes
    rules:
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $value | printf "%.0f" }} times in 15m'

      - alert: ContainerOOMKilled
        expr: |
          increase(kube_pod_container_status_restarts_total[10m]) > 0
          and on (namespace, pod, container)
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOMKilled'

      - alert: ContainerMemoryNearLimit
        expr: |
          100 * container_memory_working_set_bytes{container!="", container!="POD"}
          / (container_spec_memory_limit_bytes{container!="", container!="POD"} > 0) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) at {{ $value | printf "%.0f" }}% of its memory limit'

      - alert: PodNotRunning
        expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} has not been running for 15m'

      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Deployment {{ $labels.namespace }}/{{ $labels.deployment }} does not have all replicas available'

      - alert: PersistentVolumeHigh
        expr: 100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} at {{ $value | printf "%.0f" }}%'

      - alert: PersistentVolumeHigh
        expr: 100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} at {{ $value | printf "%.0f" }}%'

  - name: monitoring
    rules:
      - alert: TargetDown
        expr: up{job!="node-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})'

  - name: platform
    rules:
      - alert: NodeInodesLow
        expr: 100 * node_filesystem_files_free{fstype!~"tmpfs|ramfs|squashfs|overlay"} / node_filesystem_files{fstype!~"tmpfs|ramfs|squashfs|overlay"} < 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Only {{ $value | printf "%.0f" }}% inodes free on {{ $labels.mountpoint }}'

      # Application data is backed up every 6 hours, the control plane daily.
      - alert: BackupStale
        expr: time() - polinetwork_backup_last_success_timestamp_seconds{backup="applications"} > 7 * 3600
        labels:
          severity: critical
          backup: applications
        annotations:
          summary: 'No successful application backup for {{ $value | humanizeDuration }}'

      - alert: BackupStale
        expr: time() - polinetwork_backup_last_success_timestamp_seconds{backup="control-plane"} > 26 * 3600
        labels:
          severity: critical
          backup: control-plane
        annotations:
          summary: 'No successful control-plane backup for {{ $value | humanizeDuration }}'

      - alert: BackupMetricsMissing
        expr: absent(polinetwork_backup_last_success_timestamp_seconds{backup="applications"}) or absent(polinetwork_backup_last_success_timestamp_seconds{backup="control-plane"})
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: 'Backup freshness metrics are missing; backups may not be running'

      - alert: FluxResourceNotReady
        expr: flux_resource_info{ready!="True", suspended="False"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready ({{ $labels.reason }})'

      - alert: ExternalSecretNotReady
        expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} cannot sync from Key Vault'

      - alert: SecretStoreNotReady
        expr: clustersecretstore_status_condition{condition="Ready", status="False"} == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'ClusterSecretStore {{ $labels.name }} cannot reach Key Vault'

      # Alerts still reach Telegram: Alertmanager only needs outbound access.
      - alert: CloudflareTunnelDown
        expr: sum(cloudflared_tunnel_ha_connections) < 1 or absent(cloudflared_tunnel_ha_connections)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'The k3s01 Cloudflare tunnel has no connections: public hostnames are down'

      - alert: CloudflareConnectorDegraded
        expr: cloudflared_tunnel_ha_connections < 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'cloudflared {{ $labels.pod }} has only {{ $value }} tunnel connections'
