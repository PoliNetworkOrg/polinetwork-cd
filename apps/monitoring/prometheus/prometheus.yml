global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  - job_name: 'alertmanager'
    static_configs:
      - targets:
          - 'alertmanager:9093'

  # One target per node: node-exporter listens on hostPort 9100 of every node,
  # so going through the Service would hit a random node on each scrape.
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels:
          - __address__
        regex: '(.+):\d+'
        replacement: '${1}:9100'
        target_label: __address__
      - source_labels:
          - __meta_kubernetes_node_name
        target_label: node

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets:
          - 'kube-state-metrics:8080'

  - job_name: 'kubernetes-cadvisor'
    scheme: https

    kubernetes_sd_configs:
      - role: node

    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

      - target_label: __address__
        replacement: kubernetes.default.svc:443

      - source_labels:
          - __meta_kubernetes_node_name
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

  # Kubelet metrics, only used for PVC usage (kubelet_volume_stats_*).
  - job_name: 'kubernetes-kubelet'
    scheme: https

    kubernetes_sd_configs:
      - role: node

    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    relabel_configs:
      - source_labels:
          - __meta_kubernetes_node_name
        target_label: node

      - target_label: __address__
        replacement: kubernetes.default.svc:443

      - source_labels:
          - __meta_kubernetes_node_name
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics

    metric_relabel_configs:
      - source_labels:
          - __name__
        regex: 'kubelet_volume_stats_(used|capacity|available)_bytes'
        action: keep

  # Flux Operator: flux_resource_info reports readiness of every Flux object.
  - job_name: 'flux-operator'
    static_configs:
      - targets:
          - 'flux-operator.flux-system.svc:8080'

  # External Secrets controller: ExternalSecret and SecretStore conditions.
  - job_name: 'external-secrets'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - external-secrets
    relabel_configs:
      - source_labels:
          - __meta_kubernetes_pod_label_app_kubernetes_io_name
        regex: external-secrets
        action: keep
      - source_labels:
          - __meta_kubernetes_pod_ip
        target_label: __address__
        replacement: '${1}:8080'
      - source_labels:
          - __meta_kubernetes_pod_name
        target_label: pod

  # cloudflared: one target per replica, so a single dead connector shows up.
  - job_name: 'cloudflared'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - cloudflared
    relabel_configs:
      - source_labels:
          - __meta_kubernetes_pod_label_app
        regex: cloudflared
        action: keep
      - source_labels:
          - __meta_kubernetes_pod_ip
        target_label: __address__
        replacement: '${1}:2000'
      - source_labels:
          - __meta_kubernetes_pod_name
        target_label: pod
