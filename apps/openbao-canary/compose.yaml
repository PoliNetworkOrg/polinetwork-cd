services:
  openbao-canary:
    profiles: [secrets-canary]
    image: alpine:3.22.1
    restart: unless-stopped
    user: "100:1000"
    command:
      - sh
      - -ec
      - >-
        grep -qx 'openbao-agent-ok' /run/secrets/canary_message;
        while :; do sleep 3600; done
    read_only: true
    secrets: [canary_message]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 16m
    cpus: 0.10
    pids_limit: 16
    healthcheck:
      test: [CMD-SHELL, "grep -qx 'openbao-agent-ok' /run/secrets/canary_message"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    network_mode: none

secrets:
  canary_message:
    environment: CANARY_MESSAGE
