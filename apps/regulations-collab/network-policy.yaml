# regulations-collab faces the internet: Traefik reaches the websocket port
# only, the backend the internal API, and collab itself may reach only DNS,
# PostgreSQL and the LaTeX worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: regulations-collab
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app: regulations-collab
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 4100
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 4101
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: latex-worker
          podSelector:
            matchLabels:
              app: latex-worker
      ports:
        - port: 4200
          protocol: TCP
