# Regulations editor secrets, from kv-pn-apps. The Flux Kustomization
# (clusters/k3s/apps/regulations-secrets.yaml) is Ready only once the two core
# entries exist; regulations-collab and latex-worker wait for it, so nothing
# that needs them runs, fails or alerts before Lorenzo creates them. The GitHub
# and LLM entries are optional and gate nothing: the backend reads them with
# optional refs.
# Backend <-> regulations-collab, and the bearer token both send to latex-worker.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regulations-core
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: regulations-core
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-secret
      remoteRef:
        key: regulations-internal-secret
    - secretKey: worker-secret
      remoteRef:
        key: regulations-worker-secret
---
# The same worker token, for the worker to check.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regulations
  namespace: latex-worker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: regulations
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: worker-secret
      remoteRef:
        key: regulations-worker-secret
---
# The GitHub App on PoliNetworkOrg/legal: its PEM key and webhook secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regulations-github
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: regulations-github
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: private-key
      remoteRef:
        key: regulations-github-app-private-key
    - secretKey: webhook-secret
      remoteRef:
        key: regulations-github-webhook-secret
---
# The LLM provider key for the differences summary.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regulations-llm
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: regulations-llm
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: regulations-llm-api-key
