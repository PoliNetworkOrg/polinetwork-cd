# Vaultwarden takes a single DATABASE_URL, so it is assembled here from the
# dedicated role on the shared PostgreSQL instance. The role and database are
# created once by hand on postgres-service:
#   CREATE ROLE vaultwarden LOGIN PASSWORD '...';
#   CREATE DATABASE vaultwarden OWNER vaultwarden;
# vaultwarden-admin-token is an Argon2 PHC string (`vaultwarden hash`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azure-kv
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-apps
  target:
    name: azure-kv
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        database-url: "postgresql://{{ .dbUser | urlquery }}:{{ .dbPass | urlquery }}@postgres-service.postgres.svc.cluster.local:5432/vaultwarden"
        admin-token: "{{ .adminToken }}"
        oidc-client-id: "{{ .oidcClientID }}"
        oidc-client-secret: "{{ .oidcClientSecret }}"
  data:
    - secretKey: dbUser
      remoteRef:
        key: vaultwarden-postgres-user
    - secretKey: dbPass
      remoteRef:
        key: vaultwarden-postgres-password
    - secretKey: adminToken
      remoteRef:
        key: vaultwarden-admin-token
    - secretKey: oidcClientID
      remoteRef:
        key: vaultwarden-oidc-client-id
    - secretKey: oidcClientSecret
      remoteRef:
        key: vaultwarden-oidc-client-secret
