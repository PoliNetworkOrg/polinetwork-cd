services:
  wave1-canary-a:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, NET_BIND_SERVICE, SETGID, SETUID]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [pn-edge, pn-app]
    labels:
      traefik.enable: "true"
      traefik.docker.network: pn-edge
      traefik.http.routers.wave1-canary-a.rule: Host(`wave1-a.invalid`)
      traefik.http.services.wave1-canary-a.loadbalancer.server.port: "80"

  wave1-canary-c:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, NET_BIND_SERVICE, SETGID, SETUID]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [pn-edge, pn-app]
    labels:
      traefik.enable: "true"
      traefik.docker.network: pn-edge
      traefik.http.routers.wave1-canary-b.rule: Host(`wave1-c.invalid`)
      traefik.http.services.wave1-canary-b.loadbalancer.server.port: "80"

networks:
  pn-edge:
    external: true
    name: pn-edge
  pn-app:
    external: true
    name: pn-app
