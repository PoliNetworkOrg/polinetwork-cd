# Generates the admin Kustomization with the current digest of
# ghcr.io/polinetworkorg/admin:latest (provider admin-image).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: admin
  namespace: flux-system
spec:
  inputStrategy:
    name: Permute
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: admin-image
  resources:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: admin
        namespace: flux-system
        annotations:
          # Never garbage-collect the app if the provider exports no inputs.
          fluxcd.controlplane.io/prune: disabled
      spec:
        dependsOn:
          - name: infrastructure-secret-stores
          - name: infrastructure-storage
          - name: infrastructure-traefik
        interval: 30m
        retryInterval: 1m
        timeout: 5m
        prune: true
        wait: true
        sourceRef:
          kind: GitRepository
          name: flux-system
        path: ./apps/admin
        images:
          - name: ghcr.io/polinetworkorg/admin
            newTag: << inputs.admin_image.tag | quote >>
            digest: << inputs.admin_image.digest | quote >>
