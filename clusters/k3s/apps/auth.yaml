# Generates the auth Kustomization with the current digest of
# ghcr.io/polinetworkorg/auth:latest (provider auth-image).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: auth
  namespace: flux-system
spec:
  inputStrategy:
    name: Permute
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: auth-image
  resources:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: auth
        namespace: flux-system
        annotations:
          # Never garbage-collect the app if the provider exports no inputs.
          fluxcd.controlplane.io/prune: disabled
      spec:
        dependsOn:
          - name: infrastructure-secret-stores
          - name: infrastructure-storage
          - name: infrastructure-traefik
          - name: postgres
        interval: 30m
        retryInterval: 1m
        timeout: 5m
        prune: true
        wait: true
        sourceRef:
          kind: GitRepository
          name: flux-system
        path: ./apps/auth
        images:
          - name: ghcr.io/polinetworkorg/auth
            newTag: << inputs.auth_image.tag | quote >>
            digest: << inputs.auth_image.digest | quote >>
