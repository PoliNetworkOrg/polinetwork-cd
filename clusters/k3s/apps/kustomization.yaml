# Workloads Flux runs on K3s. Each file stays inert until it is listed here at
# that workload's cutover, so nothing runs on AKS and K3s at the same time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - admin.yaml
  - auth.yaml
  - backend.yaml
  - bot-mat.yaml
  - bot-ts.yaml
  - influxdb.yaml
  - monitoring.yaml
  - polinetcc.yaml
  - postgres.yaml
  - redis.yaml
  - uptime-kuma.yaml
  - web.yaml
