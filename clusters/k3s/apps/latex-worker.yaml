# Unlike the other image providers (infrastructure/image-automation), this one
# lives here, under the root sync, which does not wait for health: until the
# image exists and its package is public, the provider is the only thing that
# reports an error, and infrastructure-image-automation stays Ready.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: latex-worker-image
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "6h"
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/polinetworkorg/latex-worker
  filter:
    includeTag: '^latest$'
    limit: 1
---
# Generates the latex-worker Kustomization with the current digest of
# ghcr.io/polinetworkorg/latex-worker:latest (provider latex-worker-image).
# Nothing is deployed until that image is pullable (the backend repository
# publishes it, and the package is public) and regulations-secrets is Ready.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: latex-worker
  namespace: flux-system
spec:
  inputStrategy:
    name: Permute
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: latex-worker-image
  resources:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: latex-worker
        namespace: flux-system
        annotations:
          # Never garbage-collect the app if the provider exports no inputs.
          fluxcd.controlplane.io/prune: disabled
      spec:
        dependsOn:
          - name: regulations-secrets
        interval: 30m
        retryInterval: 2m
        timeout: 5m
        prune: true
        wait: true
        sourceRef:
          kind: GitRepository
          name: flux-system
        path: ./apps/latex-worker
        images:
          - name: ghcr.io/polinetworkorg/latex-worker
            newTag: << inputs.latex_worker_image.tag | quote >>
            digest: << inputs.latex_worker_image.digest | quote >>
