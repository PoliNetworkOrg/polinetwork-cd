# Generates the live-audience Kustomization with the current digest of
# ghcr.io/polinetworkorg/live-audience:latest (provider live-audience-image).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: live-audience
  namespace: flux-system
spec:
  inputStrategy:
    name: Permute
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: live-audience-image
  resources:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: live-audience
        namespace: flux-system
        annotations:
          # Never garbage-collect the app if the provider exports no inputs.
          fluxcd.controlplane.io/prune: disabled
      spec:
        dependsOn:
          - name: infrastructure-secret-stores
          - name: infrastructure-storage
          - name: infrastructure-traefik
        interval: 30m
        retryInterval: 1m
        timeout: 5m
        prune: true
        wait: true
        sourceRef:
          kind: GitRepository
          name: flux-system
        path: ./apps/live-audience
        images:
          - name: ghcr.io/polinetworkorg/live-audience
            newTag: << inputs.live_audience_image.tag | quote >>
            digest: << inputs.live_audience_image.digest | quote >>
