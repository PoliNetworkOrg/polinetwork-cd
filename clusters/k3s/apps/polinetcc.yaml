# Generates the polinetcc Kustomization with the current digest of
# ghcr.io/polinetworkorg/polinet.cc:latest (provider polinetcc-image).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: polinetcc
  namespace: flux-system
spec:
  inputStrategy:
    name: Permute
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: polinetcc-image
  resources:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: polinetcc
        namespace: flux-system
        annotations:
          # Never garbage-collect the app if the provider exports no inputs.
          fluxcd.controlplane.io/prune: disabled
      spec:
        dependsOn:
          - name: infrastructure-secret-stores
          - name: infrastructure-storage
          - name: infrastructure-traefik
          - name: postgres
        interval: 30m
        retryInterval: 1m
        timeout: 5m
        prune: true
        wait: true
        sourceRef:
          kind: GitRepository
          name: flux-system
        path: ./apps/polinetcc
        images:
          - name: ghcr.io/polinetworkorg/polinet.cc
            newTag: << inputs.polinetcc_image.tag | quote >>
            digest: << inputs.polinetcc_image.digest | quote >>
