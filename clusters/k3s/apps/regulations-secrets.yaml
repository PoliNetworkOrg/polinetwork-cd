# The regulations editor's gate. It applies every regulations ExternalSecret but
# is Ready only once the core ones sync (the Key Vault entries
# regulations-internal-secret and regulations-worker-secret exist).
# regulations-collab and latex-worker depend on it, so before those entries
# exist no Pod of theirs is created: nothing fails, restarts or alerts. Once
# they exist, both start by themselves within a few minutes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: regulations-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-secret-stores
  interval: 30m
  retryInterval: 2m
  timeout: 2m
  prune: true
  # Only the core secrets decide readiness; the GitHub App and LLM entries
  # are optional and may arrive much later.
  wait: false
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: regulations-core
      namespace: backend
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: regulations
      namespace: latex-worker
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/regulations-secrets
