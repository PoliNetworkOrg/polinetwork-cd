apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-fluxcd-ui
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-secret-stores
    - name: infrastructure-traefik
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/fluxcd-ui
