name: applications

services:
  wave1-canary-a:
    profiles: [lab]
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, NET_BIND_SERVICE, SETGID, SETUID]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [pn-edge, pn-app]
    labels:
      traefik.enable: "true"
      traefik.docker.network: pn-edge
      traefik.http.routers.wave1-canary-a.rule: Host(`wave1-a.invalid`)
      traefik.http.services.wave1-canary-a.loadbalancer.server.port: "80"

  wave1-canary-b:
    profiles: [lab]
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, NET_BIND_SERVICE, SETGID, SETUID]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [pn-edge, pn-app]
    labels:
      traefik.enable: "true"
      traefik.docker.network: pn-edge
      traefik.http.routers.wave1-canary-b.rule: Host(`wave1-b.invalid`)
      traefik.http.services.wave1-canary-b.loadbalancer.server.port: "80"

  openbao-agent-canary:
    profiles: [secrets-canary]
    image: quay.io/openbao/openbao:2.5.4
    restart: unless-stopped
    command: [agent, -config=/openbao/agent/config.hcl]
    volumes:
      - ./openbao-canary/agent.hcl:/openbao/agent/config.hcl:ro
      - ./openbao-canary/canary.env.ctmpl:/openbao/templates/canary.env.ctmpl:ro
      - /srv/polinetwork/state/openbao/tls/ca.crt:/openbao/tls/ca.crt:ro
      - /srv/polinetwork/state/openbao/approle/canary:/openbao/auth:ro
      - openbao-canary-secrets:/run/secrets
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "grep -qx 'CANARY_MESSAGE=openbao-agent-ok' /run/secrets/canary.env"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [pn-secrets]

  openbao-canary:
    profiles: [secrets-canary]
    image: alpine:3.22.1
    restart: unless-stopped
    user: "100:1000"
    command:
      - sh
      - -ec
      - >-
        until grep -qx 'CANARY_MESSAGE=openbao-agent-ok' /run/secrets/canary.env;
        do sleep 1; done;
        while :; do sleep 3600; done
    depends_on:
      openbao-agent-canary:
        condition: service_healthy
    read_only: true
    volumes:
      - openbao-canary-secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 16m
    cpus: 0.10
    pids_limit: 16
    healthcheck:
      test: [CMD-SHELL, "grep -qx 'CANARY_MESSAGE=openbao-agent-ok' /run/secrets/canary.env"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    network_mode: none

networks:
  pn-edge:
    external: true
    name: pn-edge
  pn-app:
    external: true
    name: pn-app
  pn-secrets:
    external: true
    name: pn-secrets

volumes:
  openbao-canary-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=100,gid=1000,mode=0770,size=1m
