name: edge

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
    env_file:
      - /srv/polinetwork/state/cloudflare/compose.env
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 128
    networks: [pn-edge]

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=4m,mode=0755
      - /tmp:size=4m,mode=1777
      - /var/lib/haproxy:size=4m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    networks: [socket-api]

  traefik:
    image: traefik:v3.7.1
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    command:
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --ping=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=pn-edge
      - --providers.docker.watch=true
      - --providers.file.filename=/etc/traefik/dynamic/openbao-tls.yaml
      - --providers.file.watch=true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./dynamic/openbao-tls.yaml:/etc/traefik/dynamic/openbao-tls.yaml:ro
      - /srv/polinetwork/state/openbao/tls/ca.crt:/etc/traefik/certs/openbao-ca.crt:ro
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [pn-edge, socket-api]

networks:
  pn-edge:
    external: true
    name: pn-edge
  socket-api:
    internal: true
