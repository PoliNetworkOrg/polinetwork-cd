name: komodo

services:
  mongo:
    image: mongo:8.0.28
    command: --quiet --wiredTigerCacheSizeGB 0.25
    entrypoint: [/bin/sh, /usr/local/bin/pn-mongo-entrypoint]
    restart: unless-stopped
    labels:
      komodo.skip: "true"
    secrets:
      - database_username
      - database_password
    volumes:
      - ./mongo-entrypoint.sh:/usr/local/bin/pn-mongo-entrypoint:ro
      - /srv/polinetwork/state/komodo/mongo-data:/data/db
      - /srv/polinetwork/state/komodo/mongo-config:/data/configdb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$(cat /run/secrets/database_username)"
          --password "$$(cat /run/secrets/database_password)"
          --authenticationDatabase admin
          --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 0.75
    pids_limit: 256
    networks: [komodo-api]

  core:
    image: ghcr.io/moghtech/komodo-core:2.2.0
    init: true
    restart: unless-stopped
    labels:
      komodo.skip: "true"
      traefik.enable: "true"
      traefik.docker.network: pn-edge
      traefik.http.routers.komodo.rule: Host(`komodo.polinetwork.org`)
      traefik.http.services.komodo.loadbalancer.server.port: "9120"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME_FILE: /run/secrets/database_username
      KOMODO_DATABASE_PASSWORD_FILE: /run/secrets/database_password
      KOMODO_INIT_ADMIN_USERNAME_FILE: /run/secrets/init_admin_username
      KOMODO_INIT_ADMIN_PASSWORD_FILE: /run/secrets/init_admin_password
      KOMODO_WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      KOMODO_JWT_SECRET_FILE: /run/secrets/jwt_secret
      KOMODO_HOST: https://komodo.polinetwork.org
      KOMODO_TITLE: PoliNetwork Komodo Lab
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_ENABLE_NEW_USERS: "false"
      KOMODO_DISABLE_NON_ADMIN_CREATE: "true"
      KOMODO_TRANSPARENT_MODE: "false"
      KOMODO_FIRST_SERVER_NAME: vm01
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
      KOMODO_JWT_TTL: 1-day
      KOMODO_MONITORING_INTERVAL: 15-sec
      KOMODO_RESOURCE_POLL_INTERVAL: 1-hr
      TZ: Europe/Rome
    secrets:
      - database_username
      - database_password
      - init_admin_username
      - init_admin_password
      - webhook_secret
      - jwt_secret
    volumes:
      - /srv/polinetwork/state/komodo/keys:/config/keys
      - /srv/polinetwork/state/komodo/backups:/backups
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256
    networks: [komodo-api, pn-edge]

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.2.0
    init: true
    restart: unless-stopped
    labels:
      komodo.skip: "true"
    depends_on: [core]
    environment:
      PERIPHERY_CORE_ADDRESS: ws://core:9120
      PERIPHERY_CONNECT_AS: vm01
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ROOT_DIRECTORY: /srv/polinetwork/compose
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
      PERIPHERY_DISABLE_TERMINALS: "true"
      PERIPHERY_DISABLE_CONTAINER_EXEC: "true"
      TZ: Europe/Rome
    volumes:
      - /srv/polinetwork/state/komodo/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc:ro
      - /srv/polinetwork/compose:/srv/polinetwork/compose
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 256
    networks: [komodo-api, komodo-egress]

networks:
  komodo-api:
    internal: true
  komodo-egress:
  pn-edge:
    external: true
    name: pn-edge

secrets:
  database_username:
    file: /srv/polinetwork/state/komodo/secrets/database-username
  database_password:
    file: /srv/polinetwork/state/komodo/secrets/database-password
  init_admin_username:
    file: /srv/polinetwork/state/komodo/secrets/init-admin-username
  init_admin_password:
    file: /srv/polinetwork/state/komodo/secrets/init-admin-password
  webhook_secret:
    file: /srv/polinetwork/state/komodo/secrets/webhook-secret
  jwt_secret:
    file: /srv/polinetwork/state/komodo/secrets/jwt-secret
