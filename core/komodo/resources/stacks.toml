# Seed one Git-backed Resource Sync with this directory. It then keeps itself
# and the VM stacks declarative. Deployment is deliberately manual until the
# legacy Compose projects have completed their reviewed cutover.

[[resource_sync]]
name = "polinetwork-vm"
description = "Git-backed Komodo resources for vm01"
tags = ["vm-managed"]

[resource_sync.config]
git_provider = "github.com"
repo = "PoliNetworkOrg/polinetwork-cd"
branch = "vm"
resource_path = ["core/komodo/resources"]
delete = false
include_resources = true
include_variables = false
include_user_groups = false

[[stack]]
name = "core"
description = "Shared VM services managed by Komodo; Komodo itself is excluded"
tags = ["vm-managed", "core"]

[stack.config]
server = "vm01"
project_name = "core"
git_provider = "github.com"
repo = "PoliNetworkOrg/polinetwork-cd"
branch = "vm"
reclone = true
run_directory = "core"
file_paths = ["compose.yaml"]
auto_pull = true
webhook_enabled = false
pre_deploy = { path = ".", command = "../bootstrap/render-compose-catalog.sh . compose.yaml" }
extra_args = ["--remove-orphans"]

[[stack]]
name = "applications"
description = "PoliNetwork Docker applications"
tags = ["vm-managed", "applications"]

[stack.config]
server = "vm01"
project_name = "applications"
git_provider = "github.com"
repo = "PoliNetworkOrg/polinetwork-cd"
branch = "vm"
reclone = true
run_directory = "apps"
file_paths = ["compose.yaml"]
auto_pull = true
webhook_enabled = false
pre_deploy = { path = ".", command = "../bootstrap/render-compose-catalog.sh . compose.yaml" }
extra_args = ["--remove-orphans"]

[[procedure]]
name = "deploy-polinetwork-vm"
description = "Sync Git declarations, then deploy discovered core and application folders"
tags = ["vm-managed"]

[[procedure.config.stage]]
name = "Sync declarations"
executions = [
  { execution.type = "RunSync", execution.params.sync = "polinetwork-vm" },
]

[[procedure.config.stage]]
name = "Deploy core"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "core" },
]

[[procedure.config.stage]]
name = "Deploy applications"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "applications" },
]
