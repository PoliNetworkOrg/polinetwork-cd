name: openbao

services:
  openbao:
    image: quay.io/openbao/openbao:2.5.4
    restart: unless-stopped
    command: [server]
    env_file:
      - /srv/polinetwork/state/openbao/compose.env
    environment:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /openbao/tls/ca.crt
      BAO_LOCAL_CONFIG: >-
        {"ui":true,"log_level":"info","api_addr":"https://openbao.polinetwork.org","cluster_addr":"https://openbao:8201","seal":{"azurekeyvault":{"vault_name":"kv-polinetwork","key_name":"openbao-unseal"}},"storage":{"raft":{"path":"/openbao/file/raft","node_id":"vm01"}},"listener":{"tcp":{"address":"0.0.0.0:8200","cluster_address":"0.0.0.0:8201","tls_cert_file":"/openbao/tls/tls.crt","tls_key_file":"/openbao/tls/tls.key","tls_min_version":"tls12"}},"audit":[{"file":{"persistent-file":{"description":"Persistent OpenBao audit log","options":{"file_path":"/openbao/logs/audit.log","mode":"0600"}}}}],"telemetry":{"disable_hostname":true}}
    volumes:
      - /srv/polinetwork/state/openbao:/openbao/file
      - /srv/polinetwork/state/openbao/audit:/openbao/logs
      - /srv/polinetwork/state/openbao/tls:/openbao/tls:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 512m
    mem_swappiness: 0
    cpus: 0.50
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bao status >/dev/null 2>&1;
          code=$$?;
          test $$code -eq 0 -o $$code -eq 2
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.docker.network: pn-edge
      traefik.http.routers.openbao.rule: Host(`openbao.polinetwork.org`)
      traefik.http.services.openbao.loadbalancer.server.port: "8200"
      traefik.http.services.openbao.loadbalancer.server.scheme: https
      traefik.http.services.openbao.loadbalancer.serverstransport: openbao-tls@file
    networks: [pn-secrets, pn-edge]

networks:
  pn-secrets:
    external: true
    name: pn-secrets
  pn-edge:
    external: true
    name: pn-edge
