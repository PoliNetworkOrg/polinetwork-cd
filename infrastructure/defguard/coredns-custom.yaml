# Private names for the VPN dashboards, served by the K3s CoreDNS, which
# imports *.server keys of this ConfigMap as extra zones. Only clients that use
# the cluster DNS can resolve them: the VPNs set DNS to 10.53.0.10 and include
# 10.53.0.10/32 plus the dashboard addresses in their Allowed IPs. The one
# ConfigMap also carries the WireGuard Portal name (infrastructure/wg-portal).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  defguard.server: |
    polinetwork.internal:53 {
        errors
        hosts {
            10.53.0.80 defguard.polinetwork.internal
            10.53.0.81 wg-portal.polinetwork.internal
        }
    }
