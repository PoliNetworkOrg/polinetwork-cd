# Core is the control plane. It is stateless apart from PostgreSQL: the secret
# key, OpenID signing key and internal CA are generated by the setup wizard and
# stored in the database. Core dials Edge and Gateway over gRPC, never the
# other way round, so its own gRPC port is not exposed.
#
# The dashboard has no public hostname: admins open
# http://defguard.polinetwork.internal over the VPN (coredns-custom.yaml). The
# address is pinned in the lower part of the Service CIDR, which Kubernetes
# keeps for static assignment. Plain HTTP stays inside the WireGuard tunnel.
apiVersion: v1
kind: Service
metadata:
  name: defguard-core
  namespace: defguard
  labels:
    app: defguard-core
spec:
  clusterIP: 10.53.0.80
  ports:
    - name: http
      port: 80
      targetPort: 8000
  selector:
    app: defguard-core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defguard-core
  namespace: defguard
spec:
  replicas: 1
  # Migrations run at startup; never let two versions share the database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: defguard-core
  template:
    metadata:
      labels:
        app: defguard-core
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: defguard-core
          image: ghcr.io/defguard/defguard:2.1.1@sha256:1f7cf55fb3fa2443d125fa10bc85f4fcae053ac924ff5654e5c1591c0e475e45
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DEFGUARD_HTTP_PORT
              value: "8000"
            # Served over plain HTTP inside the VPN; Secure cookies would be
            # dropped by the browser.
            - name: DEFGUARD_COOKIE_INSECURE
              value: "true"
            - name: DEFGUARD_DB_HOST
              value: postgres-service.postgres.svc.cluster.local
            - name: DEFGUARD_DB_PORT
              value: "5432"
            - name: DEFGUARD_DB_NAME
              value: defguard
            - name: DEFGUARD_DB_USER
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: db-user
            - name: DEFGUARD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: azure-kv
                  key: db-pass
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              memory: "512Mi"
