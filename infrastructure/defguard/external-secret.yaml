# Core keeps all of its state, including the CA it issues component
# certificates from, in a dedicated role on the shared PostgreSQL instance, so
# the application backup's pg_dumpall covers it. Created once by hand on
# postgres-service:
#   CREATE ROLE defguard LOGIN PASSWORD '...';
#   CREATE DATABASE defguard OWNER defguard;
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azure-kv
  namespace: defguard
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-infra
  target:
    name: azure-kv
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: db-user
      remoteRef:
        key: defguard-postgres-user
    - secretKey: db-pass
      remoteRef:
        key: defguard-postgres-password
