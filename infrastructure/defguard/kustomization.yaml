apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespaces are set per resource: the CoreDNS zone lives in kube-system.

resources:
  - namespace.yaml
  - external-secret.yaml
  - deployment-core.yaml
  - deployment-edge.yaml
  - deployment-gateway.yaml
  - network-policy.yaml
  - ingress.yaml
  - coredns-custom.yaml
