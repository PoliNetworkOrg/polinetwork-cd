apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-config
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-infra
  target:
    name: flux-web-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux.polinetwork.org
            authentication:
              type: OAuth2
              sessionDuration: 24h
              oauth2:
                provider: OIDC
                issuerURL: https://auth.polinetwork.org/api/auth
                clientID: "{{ .clientID }}"
                clientSecret: "{{ .clientSecret }}"
                scopes: [openid, profile, email, "polinetwork:identity"]
                autoLogin: true
                variables:
                  # PoliNetwork permissions (flux:access, ...) from the
                  # polinetwork:identity scope; the claim is a space-separated
                  # string, empty when the user has no permissions.
                  - name: permissions
                    expression: 'has(claims.polinetwork_permissions) ? claims.polinetwork_permissions.split(" ").filter(p, p != "") : []'
                validations:
                  - expression: '"flux:access" in variables.permissions'
                    message: Flux is restricted to users with the flux:access permission.
                profile:
                  name: 'has(claims.name) && claims.name != "" ? claims.name : (has(claims.email) ? claims.email : claims.sub)'
                impersonation:
                  username: 'has(claims.email) ? claims.email : claims.sub'
                  groups: 'variables.permissions.map(p, "polinetwork:" + p)'
            userActions:
              audit: ["*"]
  data:
    - secretKey: clientID
      remoteRef:
        key: flux-web-oidc-client-id
    - secretKey: clientSecret
      remoteRef:
        key: flux-web-oidc-client-secret
