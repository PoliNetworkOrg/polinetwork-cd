apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-config
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-infra
  target:
    name: flux-web-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux.polinetwork.org
            authentication:
              type: OAuth2
              sessionDuration: 24h
              oauth2:
                provider: OIDC
                issuerURL: https://auth.polinetwork.org/api/auth
                clientID: "{{ .clientID }}"
                clientSecret: "{{ .clientSecret }}"
                scopes: [openid, profile, email, "polinetwork:identity"]
                autoLogin: true
                variables:
                  # PoliNetwork states (socio, direttivo, ...) from the
                  # polinetwork:identity scope.
                  - name: states
                    expression: '"https://auth.polinetwork.org/api/identity" in claims ? claims["https://auth.polinetwork.org/api/identity"].states : []'
                validations:
                  - expression: '"direttivo" in variables.states'
                    message: Flux is restricted to the PoliNetwork Direttivo.
                profile:
                  name: claims.name
                impersonation:
                  username: claims.email
                  groups: 'variables.states.map(s, "polinetwork:" + s)'
            userActions:
              audit: ["*"]
  data:
    - secretKey: clientID
      remoteRef:
        key: flux-web-oidc-client-id
    - secretKey: clientSecret
      remoteRef:
        key: flux-web-oidc-client-secret
