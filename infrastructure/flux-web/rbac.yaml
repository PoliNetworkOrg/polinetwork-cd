# Direttivo members can view everything and run reconcile/suspend/resume.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-direttivo
subjects:
  - kind: Group
    name: polinetwork:direttivo
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: flux-web-admin
  apiGroup: rbac.authorization.k8s.io
