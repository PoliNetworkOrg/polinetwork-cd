# The OIDC client is registered at auth.polinetwork.org/applications with
# redirect URI https://flux2.polinetwork.org/oauth2/callback.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-infra
  target:
    name: oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: fluxcd-ui-oidc-client-id
    - secretKey: client-secret
      remoteRef:
        key: fluxcd-ui-oidc-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: fluxcd-ui-cookie-secret
