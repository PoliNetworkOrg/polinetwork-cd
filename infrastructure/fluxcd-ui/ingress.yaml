# fluxcd-ui; sign-in through auth.polinetwork.org, Direttivo only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fluxcd-ui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: flux2.polinetwork.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  name: http
