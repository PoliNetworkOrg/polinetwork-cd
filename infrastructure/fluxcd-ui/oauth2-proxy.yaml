# Sign-in through auth.polinetwork.org in front of fluxcd-ui, which has no
# authentication of its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          args:
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --upstream=http://fluxcd-ui:80/
            - --redirect-url=https://flux2.polinetwork.org/oauth2/callback
            - --provider=oidc
            - --provider-display-name=PoliNetwork
            - --oidc-issuer-url=https://auth.polinetwork.org/api/auth
            - --scope=openid profile email polinetwork:identity
            - --code-challenge-method=S256
            - --skip-provider-button=true
            - --email-domain=*
            # oauth2-proxy cannot read the states list inside the
            # https://auth.polinetwork.org/api/identity claim (its name has
            # dots), so match the space-joined polinetwork_states claim, which
            # becomes a single group. States are sorted, so these are every
            # combination of the known states that includes direttivo; a new
            # state fails closed until it is added here.
            - --oidc-groups-claim=polinetwork_states
            - --allowed-group=direttivo
            - --allowed-group=direttivo socio
            - --allowed-group=direttivo student
            - --allowed-group=direttivo socio student
            # fluxcd-ui logs actions with X-Forwarded-User; oauth2-proxy
            # replaces any client-supplied copy.
            - --prefer-email-to-user=true
            - --cookie-secure=true
            # States are read at sign-in, as on flux.polinetwork.org.
            - --cookie-expire=24h
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
