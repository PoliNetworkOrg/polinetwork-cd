apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-package-webhook
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-infra
  target:
    name: github-package-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: flux-github-package-webhook-token
