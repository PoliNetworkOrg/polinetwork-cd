# One provider per PoliNetwork image: only the latest tag, resolved to its
# digest. The GitHub package webhook triggers them; 6h polling is the fallback.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: admin-image
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "6h"
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/polinetworkorg/admin
  filter:
    includeTag: '^latest$'
    limit: 1
---
