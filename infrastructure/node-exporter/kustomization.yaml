apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# node-exporter needs the host network and PID namespaces for host network and
# process metrics, which admission only allows in kube-system. Prometheus
# scrapes it on each node's InternalIP:9100, so the namespace is irrelevant.
namespace: kube-system
resources:
  - daemonset.yaml
