# One store per vault trust boundary. Conditions list the only namespaces whose
# ExternalSecrets may use each store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kv-pn-apps
spec:
  conditions:
    - namespaces:
        - auth
        - backend
        - bot-mat
        - bot-ts
        - monitoring
        - influxdb
        - polinetcc
        - postgres
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-pn-apps.vault.azure.net
      serviceAccountRef:
        name: keyvault-reader
        namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kv-pn-infra
spec:
  conditions:
    - namespaces:
        - cloudflared
        - flux-system
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-pn-infra.vault.azure.net
      serviceAccountRef:
        name: keyvault-reader
        namespace: external-secrets
