# The client secret of the "SSO Gateway" application on auth.polinetwork.org
# and the key that encrypts the session cookie (32 random bytes, URL-safe
# base64). Rotating the cookie secret signs everyone out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-infra
  target:
    name: oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: sso-oidc-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: sso-cookie-secret
