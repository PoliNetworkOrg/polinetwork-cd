# Only Traefik calls oauth2-proxy: forwardAuth checks and sso.polinetwork.org.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: sso
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 4180
          protocol: TCP
