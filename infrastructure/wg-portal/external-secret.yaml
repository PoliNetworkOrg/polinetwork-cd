# WireGuard Portal keeps users, interfaces and peers in a dedicated role on the
# shared PostgreSQL instance, so the application backup's pg_dumpall covers it.
# Created once by hand on postgres-service:
#   CREATE ROLE wgportal LOGIN PASSWORD '...';
#   CREATE DATABASE wgportal OWNER wgportal;
# Private keys in the database are encrypted with wg-portal-encryption-passphrase,
# which can never be changed and is needed to restore a dump.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azure-kv
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kv-pn-infra
  target:
    name: azure-kv
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        database-dsn: "postgres://{{ .dbUser | urlquery }}:{{ .dbPass | urlquery }}@postgres-service.postgres.svc.cluster.local:5432/wgportal?sslmode=disable"
        admin-password: "{{ .adminPassword }}"
        session-secret: "{{ .sessionSecret }}"
        csrf-secret: "{{ .csrfSecret }}"
        encryption-passphrase: "{{ .encryptionPassphrase }}"
  data:
    - secretKey: dbUser
      remoteRef:
        key: wg-portal-postgres-user
    - secretKey: dbPass
      remoteRef:
        key: wg-portal-postgres-password
    - secretKey: adminPassword
      remoteRef:
        key: wg-portal-admin-password
    - secretKey: sessionSecret
      remoteRef:
        key: wg-portal-session-secret
    - secretKey: csrfSecret
      remoteRef:
        key: wg-portal-csrf-secret
    - secretKey: encryptionPassphrase
      remoteRef:
        key: wg-portal-encryption-passphrase
