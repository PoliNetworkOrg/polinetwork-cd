# The UI admits VPN clients only: Defguard clients arrive masqueraded behind the
# Gateway Pod, WireGuard Portal's own peers behind this Pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wg-portal
spec:
  podSelector:
    matchLabels:
      app: wg-portal
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: defguard
          podSelector:
            matchLabels:
              app: defguard-gateway
        - podSelector:
            matchLabels:
              app: wg-portal
      ports:
        - port: 8888
          protocol: TCP
    # WireGuard from the internet through the hostPort.
    - ports:
        - port: 48727
          protocol: UDP
