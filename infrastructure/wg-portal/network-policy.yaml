# The UI admits VPN clients only; peers arrive masqueraded behind this Pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wg-portal
  namespace: wg-portal
spec:
  podSelector:
    matchLabels:
      app: wg-portal
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wg-portal
      ports:
        - port: 8888
          protocol: TCP
    # WireGuard from the internet through the hostPort.
    - ports:
        - port: 48726
          protocol: UDP
