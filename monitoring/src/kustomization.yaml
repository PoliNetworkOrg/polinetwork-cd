apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment-grafana.yaml
  - deployment-prometheus.yaml
  - deployment-node-exporter.yaml
  - deployment-alertmanager.yaml
  - deployment-kube-state-metrics.yaml
  - prometheus-k8s-rbac.yaml

# The generated names carry a content hash, so any change to these files
# rolls out Prometheus / Alertmanager with the new configuration.
configMapGenerator:
  - name: prometheus-server-conf
    files:
      - prometheus/prometheus.yml
      - prometheus/alert-rules.yml
  - name: alertmanager-conf
    files:
      - alertmanager/alertmanager.yml
      - alertmanager/telegram.tmpl
